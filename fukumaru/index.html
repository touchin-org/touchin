<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="TOUCH IN - 映像をひらく">
  <title>TOUCH IN | Video</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#111;color:#f7f7f7;min-height:100vh;display:flex;flex-direction:column}
    main{width:min(100%,840px);margin:auto;padding:42px 18px 52px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
    .logo{font-weight:700;letter-spacing:.2em;font-size:16px}.tag{font-size:11px;color:#aaa;letter-spacing:.1em}
    h1{font-size:clamp(22px,5vw,34px);line-height:1.5;font-weight:500;margin:0 0 25px}
    video{display:block;width:100%;aspect-ratio:16/9;max-height:70vh;background:#000;border-radius:5px}
    .hint{font-size:13px;color:#b8b8b8;margin-top:18px;line-height:1.9}footer{color:#888;font-size:11px;letter-spacing:.12em;padding-top:48px;text-align:center}
  </style>
</head>
<body><main>
  <header><div class="logo">TOUCH IN</div><div class="tag">VIDEO EXPERIENCE</div></header>
  <h1>映像を、ひらく。</h1>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="video.mp4" type="video/mp4">
    お使いのブラウザは動画再生に対応していません。
  </video>
  <p class="hint">再生ボタンをタップすると動画が始まります。音声は端末の音量設定をご確認ください。</p>
  <footer>TOUCH IN</footer>
</main></body>
</html>
